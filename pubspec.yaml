name: japmitra
description: JapMitra - आपका दैनिक आध्यात्मिक साथी
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  url_launcher: ^6.3.2
  vibration: 3.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/rashifal/
    - assets/icons/
    - assets/branding/
    - assets/images/deities/
    # Listed explicitly: the approved photograph. Declaring the directory did
    # not bundle anything, and an explicit entry also keeps the APK honest about
    # exactly which image ships.
    - assets/images/astrologer/abhijeet_srivastava.jpg
