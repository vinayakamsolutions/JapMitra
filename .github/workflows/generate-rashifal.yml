name: Generate daily Rashifal

# Publishes one day of original Rashifal content for all twelve signs.
#
# The app reads data/rashifal/YYYY-MM-DD.json over the network (see
# lib/features/rashifal/services/rashifal_remote_service.dart), so this workflow
# is what keeps that location populated. It is the only writer.
#
# On cost: this job runs on GitHub's free runners and the generator makes no
# network calls and needs no API key, so a day of content costs nothing.
#
# Schedule: Asia/Kolkata (IST). Scheduled runs execute from the default branch
# (main). The run is deliberately not at midnight — it lands after the Indian
# day has turned. GitHub does not guarantee an exact start time; a busy runner
# can delay a scheduled job by a few minutes. The generator resolves the IST
# date itself at runtime, so a slightly late run still writes the correct day.
#
# Recovery: if a scheduled run is delayed or missed, the workflow's recovery
# logic automatically fills any gap between the last valid file and today. The
# generator never overwrites an existing valid file unless --force is passed,
# so re-running is always safe. Manual backfill is also available via
# workflow_dispatch.

on:
  schedule:
    - cron: '10 0 * * *'
      timezone: 'Asia/Kolkata'

  # Lets a maintainer backfill or repair a day by hand.
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD to generate. Leave empty for the current IST date.'
        required: false
        default: ''
      force:
        description: 'Overwrite an existing day even if it already validates'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Recovery: identify missed dates between the last valid file and today.
      # This runs before normal generation so missed days are backfilled
      # automatically without manual intervention.
      - name: Identify missed dates
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import generate_rashifal as g

          IST = timezone(timedelta(hours=5, minutes=30))
          today_ist = datetime.now(IST).date()
          data_dir = Path("data/rashifal")

          existing_dates = set()
          if data_dir.exists():
              for f in data_dir.glob("*.json"):
                  try:
                      day = json.loads(f.read_text(encoding="utf-8-sig"))
                      if not g.validate(day):
                          existing_dates.add(datetime.strptime(day["date"], "%Y-%m-%d").date())
                  except (OSError, ValueError, KeyError):
                      continue

          if not existing_dates:
              print("No existing valid dates found")
              Path(".recovery_dates").write_text("", encoding="utf-8")
              sys.exit(0)

          latest = max(existing_dates)
          missing = []
          current = latest + timedelta(days=1)
          while current < today_ist:
              missing.append(current.isoformat())
              current += timedelta(days=1)

          if missing:
              print(f"Missed dates to recover: {missing}")
          else:
              print(f"No missing dates (latest: {latest}, today: {today_ist})")

          Path(".recovery_dates").write_text("\n".join(missing), encoding="utf-8")
          PY

      # Generate each missed date sequentially. The generator validates each
      # date before writing and refuses to overwrite existing valid files.
      - name: Generate missed dates
        run: |
          if [ -f .recovery_dates ] && [ -s .recovery_dates ]; then
            while IFS= read -r date; do
              if [ -n "$date" ]; then
                echo "Generating missed date: $date"
                python scripts/generate_rashifal.py --date "$date"
              fi
            done < .recovery_dates
          else
            echo "No missed dates to generate"
          fi

      # Resolves the date in Asia/Kolkata and writes data/rashifal/<date>.json.
      # Exits non-zero when the generated payload fails validation, which fails
      # this job rather than committing a broken day.
      - name: Generate today's Rashifal
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$REQUESTED_DATE" ]; then
            args+=(--date "$REQUESTED_DATE")
          fi
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          python scripts/generate_rashifal.py "${args[@]}"

      # Re-checks all files that are about to be committed, independently of the
      # generator's own exit status, so an invalid day cannot reach the app even
      # if it was produced some other way. Validates both recovered dates and
      # the current target date.
      - name: Verify all generated days are valid
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            TARGET_DATE="$REQUESTED_DATE"
          else
            TARGET_DATE=$(python -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=5,minutes=30))).strftime('%Y-%m-%d'))")
          fi
          # Carried into the commit step, since shell variables do not survive
          # between steps.
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

          # Build list of all dates to validate (recovered + target)
          DATES_FILE=".validation_dates"
          : > "$DATES_FILE"
          if [ -f .recovery_dates ] && [ -s .recovery_dates ]; then
            cat .recovery_dates >> "$DATES_FILE"
          fi
          echo "$TARGET_DATE" >> "$DATES_FILE"

          python - "$DATES_FILE" <<'PY'
          import json, sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import generate_rashifal as g

          dates_file = sys.argv[1]
          dates = [line.strip() for line in Path(dates_file).read_text().splitlines() if line.strip()]

          for date_str in dates:
              target_path = Path(f"data/rashifal/{date_str}.json")
              if not target_path.exists():
                  print(f"error: {target_path} does not exist", file=sys.stderr)
                  sys.exit(1)
              day = json.loads(target_path.read_text(encoding="utf-8-sig"))
              errors = g.validate(day)
              if day.get("date") != date_str:
                  errors.append(f"payload date does not match {date_str}")
              if errors:
                  sys.exit(f"invalid day {date_str}: " + "; ".join(errors))
              print(f"valid: {date_str} ({len(g.SIGNS)} signs)")
          PY

      # Safety check: ensure the date is not in the future. This prevents a
      # delayed run from accidentally generating a future date if the system
      # clock is wrong or the run is delayed across midnight.
      - name: Verify date is not in the future
        run: |
          TODAY_IST=$(python -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=5,minutes=30))).strftime('%Y-%m-%d'))")
          if [[ "$TARGET_DATE" > "$TODAY_IST" ]]; then
            echo "error: date $TARGET_DATE is in the future (today is $TODAY_IST)"
            exit 1
          fi
          echo "Date check passed: $TARGET_DATE is not in the future"

      - name: Commit the day, if it changed
        run: |
          # status --porcelain is used rather than git diff because a newly
          # generated day is untracked, and git diff ignores untracked files —
          # which would make a brand new day look like "no change".
          if [ -z "$(git status --porcelain -- data/rashifal)" ]; then
            echo "No change: data/rashifal is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rashifal
          git commit -m "data: Rashifal for $TARGET_DATE"
          git push
        env:
          TARGET_DATE: ${{ env.TARGET_DATE }}

      # Creates a GitHub issue when the workflow fails, so a missed or broken
      # day is visible without monitoring the Actions tab. Uses only GitHub's
      # built-in token and CLI — no external services or secrets.
      - name: Notify on failure
        if: failure()
        run: 'gh issue create --title "Rashifal workflow failed: ${{ github.run_id }}" --body "The daily Rashifal workflow failed. Run ID: ${{ github.run_id }}. Please check the logs and re-run via workflow_dispatch if needed." --label "bug" --label "automation"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
